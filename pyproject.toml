[project]
name = "atlas"
version = "0.1.0"
description = "Agentic literature review with retrieval-augmented synthesis"
requires-python = ">=3.11"
dependencies = [
  # core
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "tenacity>=8.3",
  "httpx>=0.27",
  # api
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  # llm
  "litellm>=1.40",
  "instructor>=1.3",
  # stores
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "neo4j>=5.20",
  "qdrant-client>=1.9",
  # nlp / ml
  "sentence-transformers>=3.0",
  "scikit-learn>=1.5",
  "hdbscan>=0.8.33",
  "networkx>=3.3",
  "keybert>=0.8",
  "spacy>=3.7",
  # parsing
  "lxml>=5.2",
  "pymupdf>=1.24",
  "langchain-text-splitters>=0.2",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0",
  "respx>=0.21", "testcontainers>=4.5",
  "ruff>=0.4", "mypy>=1.10", "types-PyYAML>=6.0",
]

[project.scripts]
atlas = "atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# 3.12 (not the 3.11 floor) so mypy can parse modern deps' stubs on the 3.14 dev interpreter.
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_return_any = true
[[tool.mypy.overrides]]
module = [
  "litellm.*", "instructor.*", "qdrant_client.*", "neo4j.*", "lxml.*",
  "sentence_transformers.*", "torch.*", "transformers.*", "langchain_text_splitters.*",
  "pymupdf", "fitz", "networkx.*", "keybert.*", "sklearn.*", "hdbscan.*", "spacy.*",
]
ignore_missing_imports = true
follow_imports = "skip"
# strict where correctness is load-bearing
[[tool.mypy.overrides]]
module = ["atlas.contracts", "atlas.ids", "atlas.extract.*", "atlas.gaps.*", "atlas.forage.*"]
strict = true
# the loop is orchestration glue, not scored logic — keep it non-strict
[[tool.mypy.overrides]]
module = ["atlas.forage.loop"]
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs docker services", "e2e: full pipeline"]
