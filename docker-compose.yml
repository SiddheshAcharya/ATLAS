name: atlas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/atlaspassword
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
      NEO4J_server_memory_heap_max__size: 2G
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4jdata:/data
      - neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrantdata:/qdrant/storage"]

  grobid:
    # the -crf image is ~0.5GB and CPU-only; swap to grobid/grobid:0.9.1-full (~15GB) for
    # the deep-learning models if you have the RAM and want better section detection.
    # (The tag used before, lfoppiano/grobid:0.8.1-crf, never existed on Docker Hub.)
    image: grobid/grobid:0.9.1-crf
    ports: ["8070:8070"]
    environment:
      # 1g, not 2g: the CRF models load as native memory *outside* the heap, and on a
      # ~3GB Docker VM a 2g heap got the JVM OOM-killed at ~2.3GB RSS during model load.
      # ATLAS sends one PDF at a time, so a small heap is enough.
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - ./config/grobid.yaml:/opt/grobid/grobid-home/config/grobid.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8070/api/isalive || exit 1"]
      interval: 15s
      retries: 12

volumes:
  pgdata:
  neo4jdata:
  neo4jlogs:
  qdrantdata:
